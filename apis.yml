name: Freshplum
description: >-
  Freshplum was a San Francisco data-science startup (founded 2010) that built
  cloud-based predictive analytics for e-commerce, gauging online shopper
  behavior in real time to surface personalized promotional offers and discounts
  to visitors who might otherwise abandon a purchase. During its private alpha it
  was already processing over 10M requests a day. Freshplum raised roughly $1.7M
  from investors including DCVC and GV (Google Ventures) before being acquired by
  ad-targeting company TellApart in July 2014 (TellApart was in turn acquired by
  Twitter in 2015). The company is defunct: it ships no live product, developer
  portal, documentation, or public API, and the freshplum.com domain is now a
  parked listing offered for sale via Afternic. This profile is retained as a
  historical/portfolio record; there is no API surface to enrich.
